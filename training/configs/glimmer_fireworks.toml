# GRPO run configuration (docs/plan.md, Training, GRPO).
#
# Rates are USD per 1M tokens. The cached prefill rate stays in the config for pricing but the
# loop never uses it: every prompt token is charged at the prefill rate. `base_adapter` is the
# SFT 2 adapter the run starts from and is set once the SFT export lands.

model = "accounts/fireworks/models/muse-glimmer-30b"
prefill_usd_per_1m = 1.96
cached_prefill_usd_per_1m = 0.39
sample_usd_per_1m = 4.88
train_usd_per_1m = 5.86
max_spend_usd = 50
prepass_tasks = 64
seed = 2026
tasks_per_step = 16
samples_per_task = 8
lora_rank = 16
learning_rate = 1e-5
base_adapter = ""
